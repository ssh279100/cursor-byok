name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - custom/clousiaow
    paths-ignore:
      - "**.md"
      - "CUSTOM.md"

permissions:
  contents: write

concurrency:
  group: build-windows-custom
  cancel-in-progress: true

jobs:
  windows:
    name: windows-amd64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Generate temporary updater signing key
        working-directory: apps/desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "../../.tauri" | Out-Null
          npm exec tauri signer generate -- --ci --write-keys "../../.tauri/cursor-byok-build.key"

      - name: Build Windows desktop exe
        working-directory: apps/desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.workspace }}/.tauri/cursor-byok-build.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          npm run tauri:build -- --bundles nsis
          New-Item -ItemType Directory -Force -Path "../../bin" | Out-Null
          Copy-Item "../../target/release/cursor-byok-desktop.exe" "../../bin/Cursor助手-windows-64.exe" -Force
          Get-ChildItem "../../bin"

      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: cursor-byok-windows-64
          path: bin/Cursor助手-windows-64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="custom-$(date -u +%Y%m%d-%H%M%S)-${{ github.run_number }}"
          TITLE="定制版 ${TAG}"
          NOTES="$(cat <<EOF
          ## 定制版 Windows 下载

          - 内置 API：\`https://api.clousiaow.xyz/\`
          - 模型：\`grok-4.5\`
          - 启动后输入 Key 即可
          - 已关闭应用内更新检查与推广入口

          下载下面的 \`Cursor助手-windows-64.exe\` 直接运行。
          EOF
          )"
          gh release create "$TAG" "bin/Cursor助手-windows-64.exe" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
