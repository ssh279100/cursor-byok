name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - custom/clousiaow
      - main
    paths-ignore:
      - "**.md"
      - "CUSTOM.md"

permissions:
  contents: read

jobs:
  windows:
    name: windows-amd64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Yarn Classic
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/go-task/task/v3/cmd/task@v3.43.3
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1
          # create:zip 依赖 zip 命令
          choco install zip -y --no-progress
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$HOME/go/bin:$PATH"
          task --version
          wails3 version
          protoc --version
          protoc-gen-go --version
          which zip

      - name: Build Windows package
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$HOME/go/bin:$PATH"
          task build

      - name: List artifacts
        shell: bash
        run: ls -lah bin || true

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: cursor-byok-windows-64
          path: |
            bin/windows-64.zip
            bin/*.zip
          if-no-files-found: error
          retention-days: 14