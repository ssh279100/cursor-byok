name: 宝马ai Windows 打包
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: 安装前端依赖
        working-directory: apps/desktop
        run: npm ci
      - name: 检查前端
        working-directory: apps/desktop
        run: npm run check
      - name: 界面回归测试
        working-directory: apps/desktop
        run: npm run test:ui
      - name: 验证凭据加密
        run: cargo test -p cursor-server --lib store::secrets
      - name: 验证内置模型配置
        run: cargo test -p cursor-server --lib control::gateway
      - name: 打包安装程序
        working-directory: apps/desktop
        run: npm run tauri:build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: bmapi-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/cursor-byok-desktop.exe
          if-no-files-found: error
